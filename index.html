<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"

  <meta name="theme-color" content="#08110c" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hide &amp; Seek" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hide &amp; Seek — local multiplayer game" />
  <meta
    property="og:description"
    content="Two or three players, one keyboard. Hide in buildings and bushes, ping the map, tag your friends."
  />
  <meta property="og:image" content="./icon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Hide &amp; Seek — local multiplayer game" />

  />

<body>
  <h1 class="sr-only">Hide &amp; Seek — a local multiplayer game</h1>

  <main class="wrap">
    <canvas
      id="game"
      width="1000"
      height="680"
      role="application"
      aria-label="Hide and Seek game for two or three players. Hider one uses W A S D and left Shift, hider two uses I J K L and period. The seeker uses arrow keys, right Shift and Space."
    ></canvas>
  </main>

  <noscript>

  </noscript>

  <script src="./peerjs.min.js"></script>
  <script src="./game.js?v=20261118" defer></script>
